spring:
  application:
    name: file-security-transmission-tool

mybatis:
  configuration:
    map-underscore-to-camel-case: true

authentication-result:
  succeed: "Authentication Passed"
  failed: "Authentication Failed"

client:
  serverHost: 127.0.0.1
  serverPort: 9000
  connectionTimeout: 5000
  authTimeoutSeconds: 1000
  ackTimeoutSeconds: 1000

node:
  device-id: device-default
  auto-connect: false

app:
  local-storage:
    transfer-history-path: ${TRANSFER_HISTORY_PATH:${user.home}/.file-security-transmission/transfer-history.json} #本机传输记录文件的保存路径
    sqlite-path: ${LOCAL_SQLITE_PATH:${user.home}/.file-security-transmission/local-data.db}


server:
  address: 127.0.0.1
  port: 8081
  tcp:
    enabled: false
    bind-host: 0.0.0.0
    bind-port: 9000

crypto-service:
  address: ${CRYPTO_SERVICE_ADDRESS:127.0.0.1}
  port: ${CRYPTO_SERVICE_PORT:20202}


transfer:
  chunk-size-bytes: 1048576 #1mb
  receive-dir: downloads
